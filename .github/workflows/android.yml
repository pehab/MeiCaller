name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    outputs:
      githubSigningReady: ${{ steps.githubSigning.outputs.ready }}
    runs-on: ubuntu-24.04

    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Verify update routing and APK metadata contract
        run: bash scripts/test-update-contract.sh
      - name: Configure existing GitHub APK signing identity
        id: githubSigning
        env:
          MEI_SIGNING_JSON: ${{ secrets.MEI_SIGNING_JSON }}
          EXISTING_SIGNING_READY: false
        run: python3 .github/scripts/setup-github-signing.py
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test platform compatibility patch
        run: ./gradlew -p buildSrc test --warning-mode=all

      - name: Quality checks
        run: ./gradlew qualityCheck --warning-mode=all

      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug bundleRelease --warning-mode=all

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: MeiCaller-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/output-metadata.json

  github-updates:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.build.outputs.githubSigningReady == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Download tested signed APK
        run: gh run download "$GITHUB_RUN_ID" --name MeiCaller-debug --dir apk
      - name: Publish immutable APK and verified update manifest
        run: python3 .github/scripts/publish-github-update.py
