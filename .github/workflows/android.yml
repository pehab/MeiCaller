name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Quality checks
        run: ./gradlew qualityCheck --warning-mode=all

      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --warning-mode=all

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: MeiCaller-debug
          path: app/build/outputs/apk/debug/app-debug.apk
